apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https-gateway
  annotations:
    cert-manager.io/cluster-issuer: cluster-issuer
spec:
  gatewayClassName: kgateway
  listeners:
    - name: https-root
      protocol: HTTPS
      port: 443       # Internally uses NodePort (e.g., 31000)
      hostname: "kim.tec.br"
      allowedRoutes:  # Add this block
        namespaces:
          from: All   # Allows any namespace
      tls:
        mode: Terminate
        certificateRefs:
          - name: root-kim-tec-br-tls
    - name: https-wildcard
      protocol: HTTPS
      port: 443       # Internally uses NodePort (e.g., 31000)
      hostname: "*.kim.tec.br"
      allowedRoutes:  # Add this block
        namespaces:
          from: All   # Allows any namespace
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-kim-tec-br-tls
    - name: https-mari-wildcard
      protocol: HTTPS
      port: 443       # Internally uses NodePort (e.g., 31000)
      hostname: "*.marianacabral.odo.br"
      allowedRoutes:  # Add this block
        namespaces:
          from: All   # Allows any namespace
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-marianacabral-odo-br-tls
