apiVersion: v1
kind: Service
metadata:
  name: graphite-exporter
  labels:
    app: graphite-exporter
  annotations:
    # Pinned so TrueNAS's Reporting -> Exporters config has a stable target,
    # rather than depending on whichever node happens to be up (NodePort) or
    # whatever IP MetalLB's autoAssign grabs next.
    metallb.io/loadBalancerIPs: "192.168.10.3"
spec:
  type: LoadBalancer
  selector:
    app: graphite-exporter
  ports:
    - name: carbon
      port: 2003
      targetPort: 9109
      protocol: TCP
    - name: metrics
      port: 9108
      targetPort: 9108
      protocol: TCP
