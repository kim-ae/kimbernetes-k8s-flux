apiVersion: v1
kind: Service
metadata:
  name: proxmox-exporters
  labels:
    app: proxmox-exporters
    machine_name: proxmox
spec:
  ports:
    - name: node
      port: 9100
      targetPort: 9100
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: proxmox-exporters
  labels:
    app: proxmox-exporters
    machine_name: proxmox
subsets:
  - addresses:
      - ip: 192.168.0.4
    ports:
      - name: node
        port: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: proxmox-exporters
spec:
  selector:
    matchLabels:
      app: proxmox-exporters
  # Copies the Service's "machine_name" label onto every metric scraped from this
  # target, so Prometheus/Grafana can filter/group by machine_name=proxmox.
  targetLabels:
    - machine_name
  endpoints:
    - port: node
      interval: 30s
      path: /metrics
