apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-external-service
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: qbittorrent-external-service
subsets:
  - addresses:
      - ip: 192.168.3.111
    ports:
      - port: 8080
        name: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent-external-service
spec:
  parentRefs:
    - name: internal-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - torrent.internal.kim.tec.br
  rules:
    - name: "root"
      backendRefs:
        - name: qbittorrent-external-service
          port: 8080
