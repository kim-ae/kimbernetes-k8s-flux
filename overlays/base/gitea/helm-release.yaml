# https://gitea.com/gitea/helm-gitea#installing
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
spec:
  releaseName: gitea
  interval: 5m
  chart:
    spec:
      chart: gitea
      version: "12.7.0"
      sourceRef:
        kind: HelmRepository
        name: gitea-charts
  values:
    # Ingress is not used: this cluster routes through Gateway API (kgateway),
    # wired up via HTTPRoute in the environment overlay instead.
    ingress:
      enabled: false
    # An external PostgreSQL instance is always used, so the chart's bundled
    # database and cache dependencies are disabled here.
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    valkey:
      enabled: false
    valkey-cluster:
      enabled: false
